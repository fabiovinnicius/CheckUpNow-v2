services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-checkupnow}
      POSTGRES_USER: ${POSTGRES_USER:-checkupnow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-checkupnow_local}
    volumes:
      - checkupnow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  checkupnow:
    build: .
    container_name: checkupnow
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-checkupnow}
      DB_USERNAME: ${POSTGRES_USER:-checkupnow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-checkupnow_local}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  checkupnow_postgres_data:
