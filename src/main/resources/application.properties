spring.application.name=CheckUpNow
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
server.port=8080

# PostgreSQL database configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/checkupnow}
spring.datasource.username=${DB_USERNAME:checkupnow}
spring.datasource.password=${DB_PASSWORD:checkupnow_local}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns all schema changes; Hibernate only validates entity mappings.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Session cookie protections (Secure can be enabled in HTTPS production via env).
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Static Resources
spring.web.resources.static-locations=classpath:/static/
