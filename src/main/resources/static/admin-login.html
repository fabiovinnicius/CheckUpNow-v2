<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CheckUp Now! - Acesso administrativo</title>
    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/style.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <div class="bg-wave bg-wave-tl"></div><div class="bg-wave bg-wave-br"></div>
    <div class="card">
        <div class="hero-section">
            <div class="logo-container"><svg width="80" height="80" viewBox="0 0 100 100" fill="none"><rect x="35" width="30" height="100" rx="10" fill="var(--primary)"/><rect y="35" width="100" height="30" rx="10" fill="var(--primary)"/><path d="M25 55 40 70 85 30" stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            <div class="logo-text">CheckUp Now!</div>
            <h1 class="hero-title">Gestão segura da clínica</h1>
            <p class="hero-subtitle">Controle consultas, serviços e usuários em um painel dedicado.</p>
        </div>
        <div class="form-section">
            <h2 class="form-title">Acesso administrativo</h2>
            <form id="admin-login-form">
                <div class="input-group"><input id="admin-login-email" type="email" placeholder="E-mail administrativo" required></div>
                <div class="input-group"><input id="admin-login-password" type="password" placeholder="Senha" required></div>
                <p id="admin-login-error" style="display:none;color:#b42318;font-size:13px;margin-bottom:16px;"></p>
                <div class="form-actions"><label class="checkbox-group"><input type="checkbox" id="toggle-password">Visualizar senha</label><div class="login-link"><a href="login.html">Entrar como paciente</a></div></div>
                <button type="submit" class="btn-primary">Entrar no painel</button>
            </form>
        </div>
    </div>
    <script src="js/admin-login.js?v=20261015-1"></script>
</body>
</html>
